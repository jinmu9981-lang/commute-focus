name: iPhone build and tests

on:
  push:
    branches: [main]
    paths:
      - 'CommuteFocus/**'
      - 'CommuteFocusTests/**'
      - 'CommuteFocus.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'CommuteFocus/**'
      - 'CommuteFocusTests/**'
      - 'CommuteFocus.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select an installed iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              devices = json.load(f)['devices']
          iphones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No iPhone simulator is installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Compile and run XCTest
        run: >-
          xcodebuild test -project CommuteFocus.xcodeproj -scheme CommuteFocus
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath "$RUNNER_TEMP/CommuteFocus.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: ${{ runner.temp }}/CommuteFocus.xcresult
          retention-days: 7
