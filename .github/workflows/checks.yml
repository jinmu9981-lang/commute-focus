name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm run test:database
      - run: npm run test:web

  ios:
    # Native compilation still needs verification; this job supplies an Xcode host.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select an installed iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              devices = json.load(f)['devices']
          iphones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No iPhone simulator is installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Compile and run XCTest
        run: >-
          xcodebuild test -project CommuteFocus.xcodeproj -scheme CommuteFocus
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath "$RUNNER_TEMP/CommuteFocus.xcresult"
          CODE_SIGNING_ALLOWED=NO
