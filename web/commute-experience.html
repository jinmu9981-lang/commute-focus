<style>
#commute-experience{--cf-bg:light-dark(#f3f5f1,#19221f);--cf-paper:light-dark(#ffffff,#242f29);--cf-ink:light-dark(#1d352c,#e5eee7);--cf-sub:light-dark(#67786e,#a6b8ac);--cf-line:light-dark(#e3e9df,#35463b);--cf-soft:light-dark(#e8eee5,#304238);--cf-brand:light-dark(#225b43,#abdbb4);--cf-on:light-dark(#fff,#183a27);--cf-orange:light-dark(#a26632,#dfb386);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--cf-ink);padding:24px 10px;box-sizing:border-box}
#commute-experience *{box-sizing:border-box}

#commute-experience .cf-route .cf-end{width:10px;height:10px;background:var(--cf-paper);border:2px solid var(--cf-brand);border-radius:50%;flex:none}
#commute-experience .cf-tiny{font-size:11px;color:var(--cf-sub);line-height:1.5}
#commute-experience .cf-section{margin-top:24px;margin-bottom:12px}

#commute-experience .cf-task:first-child{padding-top:0}
#commute-experience .cf-task-text{flex:1;min-width:0;overflow-wrap:anywhere}

#commute-experience .cf-order{font-size:12px;color:var(--cf-brand);width:28px;height:28px;display:grid;place-items:center;background:var(--cf-soft);border-radius:9px;flex:none}
#commute-experience .cf-duration{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--cf-sub)}
#commute-experience .cf-pair{display:flex;gap:20px;margin:16px 0 4px}
#commute-experience .cf-pair strong{display:block;font-size:29px;font-weight:500;color:var(--cf-ink)}
#commute-experience .cf-ring{width:218px;height:218px;margin:28px auto 23px;border-radius:50%;background:conic-gradient(var(--cf-brand) var(--cf-progress,0%),var(--cf-soft) 0);padding:5px}
#commute-experience .cf-ring-inner{height:100%;border-radius:50%;background:var(--cf-paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#commute-experience .cf-countdown{font-size:48px;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1.1}
#commute-experience .cf-running{text-align:center}
#commute-experience .cf-active-dot{display:inline-block;width:6px;height:6px;background:var(--cf-brand);border-radius:50%;margin-right:6px}
#commute-experience .cf-actionrow{display:flex;justify-content:space-between;gap:5px;margin-top:8px}
#commute-experience .cf-actionrow button{flex:1;font-size:12px}
#commute-experience .cf-demo{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--cf-line);width:100%;font-size:12px;color:var(--cf-sub);margin-top:17px}
#commute-experience .cf-success{width:54px;height:54px;background:var(--cf-soft);color:var(--cf-brand);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
#commute-experience .cf-confirm{display:flex;align-items:flex-start;gap:10px;font-size:14px;padding:14px 0}
#commute-experience input[type=checkbox]{accent-color:var(--cf-brand);width:20px;height:20px;flex:none;margin:0}
#commute-experience label.cf-field{display:block;font-size:12px;color:var(--cf-sub);margin-top:16px}
#commute-experience input:not([type=checkbox]),#commute-experience select{border:1px solid var(--cf-line);border-radius:10px;background:var(--cf-paper);color:var(--cf-ink);font:inherit;font-size:16px;min-height:44px;padding:10px;width:100%;margin-top:7px}
#commute-experience .cf-step-fields{display:grid;grid-template-columns:minmax(0,1fr) 65px 36px;gap:7px;align-items:center;margin-top:12px}
#commute-experience .cf-step-fields input{margin-top:0}
#commute-experience .cf-step-fields button{padding:6px;min-width:32px}
#commute-experience .cf-step-labels{display:grid;grid-template-columns:minmax(0,1fr) 65px 36px;gap:7px;font-size:11px;color:var(--cf-sub);margin-top:20px}
#commute-experience .cf-log{display:flex;align-items:center;gap:13px;padding:15px 0;border-top:1px solid var(--cf-line)}
#commute-experience .cf-log:first-child{border-top:0}
#commute-experience .cf-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--cf-line);font-size:14px}
#commute-experience .cf-setting:last-child{border:0}
#commute-experience .cf-setting select{width:85px;margin:0;font-size:13px}
#commute-experience .cf-banner{background:var(--cf-soft);color:var(--cf-brand);padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:14px;line-height:1.6}
#commute-experience .cf-alert{color:var(--cf-orange);font-size:12px;margin-top:12px}
#commute-experience .cf-empty{text-align:center;padding:36px 12px}
@media(max-width:360px){#commute-experience{padding:12px 0}#commute-experience .cf-content{padding:8px 16px 20px}#commute-experience .cf-top{padding-left:16px;padding-right:16px}#commute-experience h1{font-size:25px}#commute-experience .cf-card{padding:15px}#commute-experience .cf-pair{gap:14px}}
</style>
<div id="commute-experience" class="viz-dotted-background">
  <section class="cf-phone" aria-label="途间通勤专注交互体验">
    <div class="cf-status"><span id="cf-clock">09:41</span><span class="cf-status-right"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
    <header class="cf-top"><div class="cf-brand"><span class="cf-logo"><i data-lucide="route" aria-hidden="true"></i></span>途间</div><span class="cf-tag">网页体验版</span></header>
    <main id="cf-main" class="cf-content"></main>
    <nav class="cf-nav" aria-label="主导航" id="cf-nav"></nav>
    <div class="cf-homebar"></div>
  </section>
</div>
<script>
(()=>{
const root=document.getElementById('commute-experience');
const main=root.querySelector('#cf-main'), nav=root.querySelector('#cf-nav');
const uid=()=>Math.random().toString(36).slice(2,10);
const seed=()=>({version:1,page:'home',minutes:60,direction:'去程',buffer:3,reminders:true,offset:0,active:null,logs:[],tasks:[
{id:'report',title:'准备周五项目汇报',priority:0,steps:[{id:'r1',title:'整理 3 个关键结论',remaining:900,done:false},{id:'r2',title:'列出汇报大纲',remaining:1200,done:false}]},
{id:'english',title:'英语听力练习',priority:1,steps:[{id:'e1',title:'听一期短播客，记下 5 个表达',remaining:900,done:false}]},
{id:'reading',title:'读完《深度工作》',priority:2,steps:[{id:'b1',title:'阅读下一章节并写一句心得',remaining:1200,done:false}]}]});
let state=seed(), editor=null, notice='',confirmEnd=false,lastPublished='';
const saved=window.openai?.widgetState?.privateContent;
if(saved?.version===1&&Array.isArray(saved.tasks))state=saved;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const button=(act,text,cls='',extra='')=>`<button type="button" class="cursor-interaction ${cls}" data-act="${act}" ${extra}>${text}</button>`;
const now=()=>Date.now()/1000+state.offset;
const clock=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;
const time=s=>new Date(s*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const priority=p=>`<span class="cf-priority ${p?'normal':''}">${['高优先','中优先','低优先'][p]}</span>`;
function persist(){
 lastPublished=JSON.stringify(state);
 const summary={screen:state.page,commuteMinutes:state.minutes,taskCount:state.tasks.length,completedSegments:state.logs.length,activePhase:state.active?.timer?.phase||null};
 if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:summary,privateContent:state}).catch(()=>{});
}
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(incoming?.version===1&&Array.isArray(incoming.tasks)&&JSON.stringify(incoming)!==lastPublished){state=incoming;editor=null;render();}});
function makePlan(available){
 let budget=Math.max(0,Math.floor(available/60)*60),segments=[],reasons=[];
 const tasks=state.tasks.map((t,i)=>({...t,index:i})).filter(t=>!state.active?.skip.includes(t.id)).sort((a,b)=>a.priority-b.priority||a.index-b.index);
 for(const task of tasks){
  let pending=task.steps.filter(s=>!s.done).map(s=>({...s}));
  if(pending[0]?.remaining===0){reasons.push(`${task.title}需要重新估算剩余时间`);continue;}
  while(pending.length&&budget>=600){
   if(pending[0].remaining<=0)break;
   let group=[pending.shift()],total=group[0].remaining;
   while(total<600&&pending[0]?.remaining>0){group.push(pending.shift());total+=group[group.length-1].remaining;}
   if(total<600){reasons.push(`${task.title}不足 10 分钟，暂留待办`);break;}
   const rounded=Math.ceil(total/60)*60;
   let duration=Math.min(1500,rounded);
   if(rounded>duration&&rounded-duration<600)duration=rounded<=1800?rounded:rounded-600;
   duration=Math.min(duration,budget,1800);
   if(rounded>duration&&rounded-duration<600){reasons.push(`${task.title}放不下完整小段，留到下次`);break;}
   let left=duration,alloc=[],rest=[];
   for(const step of group){let used=Math.min(left,step.remaining);if(used)alloc.push({id:step.id,title:step.title,seconds:used});left-=used;step.remaining-=used;if(step.remaining>0)rest.push(step);}
   if(left&&alloc.length)alloc[alloc.length-1].seconds+=left;
   pending=rest.concat(pending);segments.push({id:uid(),taskID:task.id,title:task.title,priority:task.priority,seconds:duration,alloc});budget-=duration;
  }
 }
 return {segments,reasons,total:segments.reduce((n,s)=>n+s.seconds,0)};
}
function available(){return state.active?state.active.cutoff-now():(state.minutes-state.buffer)*60;}
function elapsed(t){return Math.min(t.segment.seconds,t.spent+(t.phase==='running'?Math.max(0,Math.min(now(),t.deadline)-t.since):0));}
function requestConfirm(){const t=state.active?.timer;if(!t)return;t.spent=elapsed(t);t.phase='confirm';persist();render();}
function checkTime(){const a=state.active,t=a?.timer;if(!a)return;if(t&&(t.phase==='running'&&(now()>=t.deadline||now()>=a.cutoff)||t.phase==='paused'&&now()>=a.cutoff)){requestConfirm();return;}if(state.page==='home'&&t&&t.phase!=='confirm'){const value=root.querySelector('#cf-count');if(value)value.textContent=clock(t.segment.seconds-elapsed(t));const ring=root.querySelector('.cf-ring');if(ring)ring.style.setProperty('--cf-progress',`${elapsed(t)/t.segment.seconds*100}%`);}}
function startSegment(segment){const a=state.active;a.timer={segment,phase:'running',spent:0,since:now(),deadline:Math.min(now()+segment.seconds,a.cutoff)};}
function settle(completed=[],estimates={},outcome='已确认'){
 const a=state.active,t=a?.timer;if(!t)return;
 const seconds=Math.floor(elapsed(t));let spent=seconds;
 const task=state.tasks.find(x=>x.id===t.segment.taskID);
 for(const part of t.segment.alloc){const used=Math.min(spent,part.seconds);spent-=used;const step=task?.steps.find(s=>s.id===part.id);if(!step)continue;step.remaining=Math.max(0,step.remaining-used);if(completed.includes(step.id)){step.done=true;step.remaining=0;}else if(estimates[step.id])step.remaining=estimates[step.id]*60;}
 state.logs.unshift({id:t.segment.id,title:t.segment.title,seconds,completed:completed.length,outcome});state.logs=state.logs.slice(0,12);a.timer=null;
 if(outcome==='跳过')a.skip.push(t.segment.taskID);
}
function home(){
 if(state.active)return activePage();
 const pending=state.tasks.flatMap(t=>t.steps).filter(s=>!s.done).length;
 return `<div class="cf-eyebrow">A LITTLE PROGRESS, ON THE WAY</div><h1>路上的时间，<br>留给重要的小事。</h1><p>一段通勤，也可以离目标近一点。</p>
 <div class="cf-card"><div class="cf-tabs" aria-label="通勤方向">${['去程','返程'].map(d=>button('direction',d, d===state.direction?'selected':'',`data-value="${d}" aria-pressed="${d===state.direction}"`)).join('')}</div>
 <div class="cf-timepick">${button('less','−','cf-adjust','aria-label="减少 5 分钟"'+(state.minutes<=10?' disabled':''))}<div><strong>${state.minutes}</strong><span>分钟</span></div>${button('more','＋','cf-adjust','aria-label="增加 5 分钟"'+(state.minutes>=180?' disabled':''))}</div>
 <div class="cf-route"><span class="cf-dot"></span><span class="cf-line"></span><span class="cf-dot"></span><span class="cf-line"></span><span class="cf-end"></span></div><div class="cf-flex cf-tiny"><span>出发</span><span>按你的节奏专注</span><span>到站</span></div>
 ${button('preview',`${icon('sparkles')}安排这次通勤`,'cf-button')}<div class="cf-footnote">已留出 ${state.buffer} 分钟，安心准备下车</div></div>
 <div class="cf-flex cf-section"><h2>等你推进</h2>${button('nav','全部任务 '+icon('arrow-up-right'),'cf-muted-button','data-page="tasks"')}</div>
 <div class="cf-card" style="margin-top:0">${state.tasks.filter(t=>t.steps.some(s=>!s.done)).slice(0,2).map(t=>`<div class="cf-task"><div class="cf-task-text"><h3>${escape(t.title)}</h3><p>${t.steps.filter(s=>!s.done).length} 个步骤 · 约 ${Math.ceil(t.steps.filter(s=>!s.done).reduce((n,s)=>n+s.remaining,0)/60)} 分钟</p></div>${priority(t.priority)}</div>`).join('')||'<p>任务清单很轻松，先添加一个想推进的目标吧。</p>'}</div><div class="cf-footnote">${pending} 个待办步骤 · 不必填满每一分钟</div>`;
}
function preview(){const plan=makePlan(available());return `${button('back',icon('arrow-left')+' 返回','cf-muted-button')}<h1>这一路，有了小目标。</h1><p>${state.direction} ${state.minutes} 分钟 · 预计 ${time(now()+state.minutes*60)} 到站</p><div class="cf-pair"><div><strong>${plan.segments.length}</strong><p>段专注</p></div><div><strong>${plan.total/60}<small style="font-size:12px"> 分钟</small></strong><p>预计投入</p></div><div><strong>${state.buffer}<small style="font-size:12px"> 分钟</small></strong><p>到站收尾</p></div></div><div class="cf-card">${plan.segments.map((s,i)=>`<div class="cf-plan-row"><span class="cf-order">${i+1}</span><div class="cf-task-text"><h3>${escape(s.alloc.map(x=>x.title).join(' → '))}</h3><p>${escape(s.title)}</p></div><span class="cf-duration">${s.seconds/60} 分钟</span></div>`).join('')||'<p>还没有适合本次时长的任务。</p>'}</div>${plan.reasons.map(r=>`<p class="cf-alert">${escape(r)}</p>`).join('')}${button('start',icon('play')+' 确认，开始通勤','cf-button',!plan.segments.length?'disabled':'')}<div class="cf-footnote">每段结束后确认进度，再决定下一步。</div>`;}
function activePage(){const a=state.active,t=a.timer;
 if(t?.phase==='confirm')return completion(t);
 if(!t){const next=makePlan(available()).segments[0];return `<div class="cf-banner" role="status">${notice||'进度已保存。休息一下，再出发。'}</div><h1>${next?'一小步，也值得。':'这一程，辛苦了。'}</h1><p>${next?'下一段仍由你决定什么时候开始。':'保留未完成的任务，下次接着推进。'}</p><div class="cf-card">${next?`<div class="cf-eyebrow">接下来 · ${next.seconds/60} 分钟</div><h2>${escape(next.alloc.map(x=>x.title).join(' → '))}</h2><p>${escape(next.title)}</p>${button('next',icon('play')+' 开始下一段','cf-button')}`:`<div class="cf-success">${icon('leaf')}</div><p style="text-align:center">${available()<600?'可用时间不足 10 分钟，准备收尾。':'暂时没有可安排的步骤。'}</p>`}</div>${endControls()}`;}
 const paused=t.phase==='paused',remaining=t.segment.seconds-elapsed(t);
 return `<div class="cf-flex cf-tiny"><span>${a.direction} · 通勤进行中</span><span>预计 ${time(a.arrival)} 到站</span></div><div class="cf-card cf-running"><span class="cf-tiny"><span class="cf-active-dot"></span>${paused?'已暂停 · 到站时间不变':'这一刻，只做一件事'}</span><div class="cf-ring" style="--cf-progress:${elapsed(t)/t.segment.seconds*100}%"><div class="cf-ring-inner"><span class="cf-tiny">${paused?'暂停中':'专注剩余'}</span><span class="cf-countdown" id="cf-count">${clock(remaining)}</span><span class="cf-tiny">本段 ${t.segment.seconds/60} 分钟</span></div></div><h2>${escape(t.segment.alloc.map(x=>x.title).join(' → '))}</h2><p style="margin-top:7px">${escape(t.segment.title)}</p>${button(paused?'resume':'pause',icon(paused?'play':'pause')+(paused?'继续专注':'换乘，暂停一下'),'cf-button')}<div class="cf-actionrow">${button('early','提前完成')}${button('skip','跳过本任务')}</div></div>${button('fast',icon('fast-forward')+' 演示：快进到本段结束','cf-demo')}${endControls()}`;
}
function endControls(){return `${confirmEnd?`<div class="cf-card"><h3>结束本次通勤？</h3><p>已投入的时间会保留，未完成任务留到下次。</p><div class="cf-actionrow">${button('cancel-end','再专注一会儿')}${button('end','保存并结束','cf-button secondary','style="margin:0"')}</div></div>`:`<div class="cf-actionrow">${button('extend','通勤延长 10 分钟','cf-muted-button')}${button('ask-end','结束通勤','cf-muted-button')}</div>`}`;}
function completion(t){let spent=t.spent;return `<div class="cf-running" style="padding-top:14px"><div class="cf-success">${icon('check')}</div><h1>又往前走了一点。</h1><p>本段投入 ${clock(t.spent)}，确认一下实际进度。</p></div><form id="cf-complete"><div class="cf-card">${t.segment.alloc.map((part,index)=>{let used=Math.min(spent,part.seconds);spent-=used;const step=state.tasks.flatMap(x=>x.steps).find(s=>s.id===part.id);const remaining=Math.max(0,(step?.remaining||0)-used);const estimate=remaining>0?Math.ceil(remaining/60):10;return `<label class="cf-confirm"><input type="checkbox" data-step="${part.id}" ${index?'disabled':''}><span>${escape(part.title)}<br><span class="cf-tiny">勾选表示已完成</span></span></label><label class="cf-field" data-estimate="${part.id}">如果仍需继续，剩余约几分钟？<input aria-label="${escape(part.title)}剩余分钟" type="number" min="1" max="480" value="${estimate}" data-remaining="${part.id}" required></label>`;}).join('')}</div><button type="submit" class="cf-button cursor-interaction">保存进度 ${icon('arrow-right')}</button></form><div class="cf-footnote">计时结束 ≠ 任务完成，由你来确认。</div>`;}
function tasksPage(){return `<div class="cf-flex"><div><div class="cf-eyebrow">ONE STEP AT A TIME</div><h1>重要的事，慢慢推进。</h1></div></div><p>先列出小步骤，时间交给途间安排。</p>${button('new',icon('plus')+' 添加大任务','cf-button')}${state.tasks.map(t=>`<div class="cf-card"><div class="cf-flex"><h2>${escape(t.title)}</h2>${priority(t.priority)}</div><div style="margin-top:13px">${t.steps.map(s=>`<div class="cf-task"><span style="color:var(--cf-brand)">${icon(s.done?'circle-check':'circle')}</span><div class="cf-task-text"><h3 style="${s.done?'text-decoration:line-through;opacity:.65':''}">${escape(s.title)}</h3><p>${s.done?'已完成':`剩余约 ${Math.ceil(s.remaining/60)} 分钟`}</p></div></div>`).join('')}</div><div class="cf-actionrow">${button('edit',icon('pencil')+' 编辑步骤','cf-muted-button',`data-id="${t.id}" ${state.active?.timer?.segment.taskID===t.id?'disabled':''}`)}${button('up',icon('arrow-up')+' 提高同级顺序','cf-muted-button',`data-id="${t.id}"`)}</div></div>`).join('')}`;}
function editorPage(){return `${button('cancel-edit',icon('arrow-left')+' 返回任务','cf-muted-button')}<h1>${editor.existing?'调整任务':'给目标一个起点。'}</h1><form id="cf-editor"><label class="cf-field">大任务名称<input name="title" maxlength="48" value="${escape(editor.title)}" placeholder="例如：准备周五项目汇报" required></label><label class="cf-field">优先级<select name="priority">${['高优先级','中优先级','低优先级'].map((p,i)=>`<option value="${i}" ${editor.priority===i?'selected':''}>${p}</option>`).join('')}</select></label><div class="cf-step-labels"><span>可以完成的小步骤</span><span>分钟</span><span></span></div>${editor.steps.map((s,i)=>`<div class="cf-step-fields"><input aria-label="步骤 ${i+1} 名称" data-title="${i}" maxlength="48" value="${escape(s.title)}" placeholder="例如：列出三个结论" required><input aria-label="步骤 ${i+1} 分钟" type="number" min="1" max="480" data-minutes="${i}" value="${Math.max(1,Math.ceil(s.remaining/60))}" required>${button('remove-step',icon('x'),'cf-muted-button',`data-index="${i}" aria-label="移除步骤 ${i+1}" ${editor.steps.length===1?'disabled':''}`)}</div>`).join('')}${button('add-step',icon('plus')+' 再加一步','cf-muted-button',editor.steps.length>=6?'disabled':'')}<button type="submit" class="cf-button cursor-interaction">保存任务</button></form><p class="cf-footnote">步骤按填写顺序安排，每段 10–30 分钟。</p>`;}
function historyPage(){const seconds=state.logs.reduce((n,l)=>n+l.seconds,0),completed=state.logs.reduce((n,l)=>n+l.completed,0);return `<div class="cf-eyebrow">SMALL STEPS COUNT</div><h1>每一点进展，都算数。</h1><p>把通勤变成一点点积累。</p><div class="cf-card"><div class="cf-pair" style="margin:0"><div><strong>${Math.floor(seconds/60)}</strong><p>分钟投入</p></div><div><strong>${completed}</strong><p>步骤完成</p></div><div><strong>${state.logs.length}</strong><p>专注记录</p></div></div></div><div class="cf-section"><h2>本次体验的足迹</h2></div><div class="cf-card" style="margin-top:0">${state.logs.map(l=>`<div class="cf-log"><span class="cf-order">${icon('check')}</span><div class="cf-task-text"><h3>${escape(l.title)}</h3><p>${clock(l.seconds)} · ${l.completed} 步完成 · ${l.outcome}</p></div></div>`).join('')||`<div class="cf-empty">${icon('footprints')}<p style="margin-top:12px">完成一段专注后，进展就会出现在这里。</p>${button('nav','去开始第一段','cf-muted-button','data-page="home"')}</div>`}</div>`;}
function settingsPage(){return `<div class="cf-eyebrow">YOUR OWN PACE</div><h1>按你的节奏。</h1><p>留一点时间给重要的事，也留一点给自己。</p><div class="cf-card"><div class="cf-setting"><span>到站收尾时间</span><select id="cf-buffer" aria-label="到站收尾分钟">${[0,1,2,3,5,10].map(n=>`<option value="${n}" ${n===state.buffer?'selected':''}>${n} 分钟</option>`).join('')}</select></div><div class="cf-setting"><label for="cf-reminders">专注结束提醒</label><input id="cf-reminders" type="checkbox" ${state.reminders?'checked':''}></div><p style="margin-top:10px">当前页面展示提醒流程。真实锁屏通知需在 iPhone App 中开启。</p></div><div class="cf-card"><div class="cf-flex"><h3>当前空间</h3><span class="cf-tag">体验模式</span></div><p style="margin-top:10px">示例任务可自由修改。这里不登录、不上传数据；账号与云同步在正式 App 中配置。</p></div><div class="cf-footnote">途间 · 把路上的时间，还给自己。</div>`;}
function render(){root.querySelector('#cf-clock').textContent=time(now());main.innerHTML=editor?editorPage():({home,preview,tasks:tasksPage,history:historyPage,settings:settingsPage}[state.page]||home)();nav.innerHTML=[['home','tram-front','通勤'],['tasks','list-checks','任务'],['history','chart-no-axes-column-increasing','记录'],['settings','sliders-horizontal','设置']].map(([page,i,label])=>button('nav',icon(i)+label,(state.page===page||page==='home'&&state.page==='preview')&&!editor?'selected':'',`data-page="${page}" aria-label="${label}" aria-current="${state.page===page?'page':'false'}"`)).join('');if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
function captureEditor(){const f=root.querySelector('#cf-editor');if(!f)return;editor.title=f.elements.title.value;editor.priority=Number(f.elements.priority.value);editor.steps.forEach((s,i)=>{s.title=f.querySelector(`[data-title="${i}"]`).value;s.remaining=Math.max(1,Math.min(480,Number(f.querySelector(`[data-minutes="${i}"]`).value)||1))*60;});}
root.addEventListener('click',event=>{const b=event.target.closest('button[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;notice='';
 if(act==='nav'){state.page=b.dataset.page;editor=null;confirmEnd=false;}
 if(act==='direction')state.direction=b.dataset.value;
 if(act==='less')state.minutes=Math.max(10,state.minutes-5);
 if(act==='more')state.minutes=Math.min(180,state.minutes+5);
 if(act==='preview')state.page='preview';
 if(act==='back')state.page='home';
 if(act==='start'){const first=makePlan(available()).segments[0];if(!first)return;state.active={direction:state.direction,arrival:now()+state.minutes*60,cutoff:now()+(state.minutes-state.buffer)*60,skip:[],timer:null};startSegment(first);state.page='home';}
 if(act==='pause'){const t=state.active.timer;t.spent=elapsed(t);t.phase='paused';}
 if(act==='resume'){const t=state.active.timer;if(available()<t.segment.seconds-t.spent){t.phase='confirm';}else{t.since=now();t.deadline=now()+t.segment.seconds-t.spent;t.phase='running';}}
 if(act==='early'){requestConfirm();return;}
 if(act==='fast'){const t=state.active.timer;if(t.phase==='paused'){t.since=now();t.deadline=Math.min(now()+t.segment.seconds-t.spent,state.active.cutoff);t.phase='running';}state.offset+=Math.max(0,t.deadline-now())+.1;requestConfirm();return;}
 if(act==='skip')settle([],{},'跳过');
 if(act==='next'){const first=makePlan(available()).segments[0];if(first)startSegment(first);}
 if(act==='extend'){state.active.arrival+=600;state.active.cutoff+=600;}
 if(act==='ask-end')confirmEnd=true;
 if(act==='cancel-end')confirmEnd=false;
 if(act==='end'){settle([],{},'结束通勤');state.active=null;confirmEnd=false;state.page='history';}
 if(act==='new'){if(state.tasks.length>=8){notice='体验版最多保留 8 个任务';return;}editor={id:uid(),title:'',priority:1,steps:[{id:uid(),title:'',remaining:900,done:false}]};}
 if(act==='edit'){editor=JSON.parse(JSON.stringify(state.tasks.find(t=>t.id===b.dataset.id)));editor.existing=true;}
 if(act==='up'){const i=state.tasks.findIndex(t=>t.id===b.dataset.id);if(i>0){const t=state.tasks.splice(i,1)[0];state.tasks.splice(i-1,0,t);}}
 if(act==='cancel-edit')editor=null;
 if(act==='add-step'){captureEditor();editor.steps.push({id:uid(),title:'',remaining:900,done:false});}
 if(act==='remove-step'){captureEditor();editor.steps.splice(Number(b.dataset.index),1);}
 persist();render();
});
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='cf-editor'){captureEditor();if(!editor.title.trim()||editor.steps.some(s=>!s.title.trim()))return;const t={id:editor.id,title:editor.title.trim(),priority:editor.priority,steps:editor.steps};const i=state.tasks.findIndex(x=>x.id===t.id);if(i>=0)state.tasks[i]=t;else state.tasks.push(t);editor=null;state.page='tasks';}else if(event.target.id==='cf-complete'){const f=event.target,done=Array.from(f.querySelectorAll('[data-step]:checked')).map(n=>n.dataset.step),estimates={};f.querySelectorAll('[data-remaining]').forEach(n=>{if(!done.includes(n.dataset.remaining))estimates[n.dataset.remaining]=Number(n.value);});settle(done,estimates);notice=done.length?`已完成 ${done.length} 个小步骤，进展已保存。`:'剩余工作量已更新，下次接着推进。';}persist();render();});
root.addEventListener('change',event=>{const el=event.target;if(el.id==='cf-buffer'){state.buffer=Number(el.value);persist();}if(el.id==='cf-reminders'){state.reminders=el.checked;persist();}if(el.matches('[data-step]')){const items=[...root.querySelectorAll('[data-step]')];let previous=true;for(const input of items){input.disabled=!previous;if(!previous)input.checked=false;const row=root.querySelector(`[data-estimate="${input.dataset.step}"]`);row.hidden=input.checked;row.querySelector('input').disabled=input.checked;previous=input.checked;}}});
render();checkTime();setInterval(checkTime,1000);
const design={rounded:21};if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.cf-phone'),onChange:()=>{root.style.setProperty('--cf-radius',design.rounded+'px');}});tweak.addSlider(design,'rounded',{label:'卡片圆角',min:12,max:28,step:2,unit:'px'});}
})();
</script>
